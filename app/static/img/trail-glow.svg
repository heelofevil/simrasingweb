<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff1028" stop-opacity=".35"/>
      <stop offset=".55" stop-color="#ff1028" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ff3048"/>
    </linearGradient>
    <filter id="wide-glow" x="-20%" y="-200%" width="150%" height="500%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="core-glow" x="-20%" y="-200%" width="150%" height="500%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <style>
      .motion path {
        stroke-dasharray: 120 580;
        animation: trail-flow 2.6s linear infinite;
      }
      @keyframes trail-flow {
        to { stroke-dashoffset: -700; }
      }
      @media (prefers-reduced-motion: reduce) {
        .motion path { animation: none; stroke-dasharray: none; }
      }
    </style>
  </defs>

  <g class="motion" fill="none" stroke-linecap="round">
    <g stroke="url(#trail)" filter="url(#wide-glow)" opacity=".8">
      <path d="M-40 365 C180 367 394 340 497 289 C541 267 548 229 576 219" stroke-width="12"/>
      <path d="M-40 386 C178 382 398 350 507 295 C547 274 554 232 576 220" stroke-width="16"/>
      <path d="M-40 408 C180 397 405 362 517 303 C552 284 558 236 577 221" stroke-width="18"/>
      <path d="M-40 431 C185 414 411 375 527 312 C557 295 562 240 578 222" stroke-width="15"/>
      <path d="M-40 455 C190 431 420 389 536 321 C562 304 566 244 579 223" stroke-width="11"/>
    </g>

    <g stroke="url(#trail)" filter="url(#core-glow)" opacity=".95">
      <path d="M-40 365 C180 367 394 340 497 289 C541 267 548 229 576 219" stroke-width="3"/>
      <path d="M-40 386 C178 382 398 350 507 295 C547 274 554 232 576 220" stroke-width="4"/>
      <path d="M-40 408 C180 397 405 362 517 303 C552 284 558 236 577 221" stroke-width="5"/>
      <path d="M-40 431 C185 414 411 375 527 312 C557 295 562 240 578 222" stroke-width="4"/>
      <path d="M-40 455 C190 431 420 389 536 321 C562 304 566 244 579 223" stroke-width="3"/>
    </g>

    <g stroke="#ff5062" opacity=".9">
      <path d="M-40 365 C180 367 394 340 497 289 C541 267 548 229 576 219" stroke-width="1"/>
      <path d="M-40 386 C178 382 398 350 507 295 C547 274 554 232 576 220" stroke-width="1.25"/>
      <path d="M-40 408 C180 397 405 362 517 303 C552 284 558 236 577 221" stroke-width="1.5"/>
      <path d="M-40 431 C185 414 411 375 527 312 C557 295 562 240 578 222" stroke-width="1.25"/>
      <path d="M-40 455 C190 431 420 389 536 321 C562 304 566 244 579 223" stroke-width="1"/>
    </g>
  </g>
</svg>
